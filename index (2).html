<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>여행 정산</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Malgun Gothic",sans-serif;margin:0;background:#f3f4f6;color:#111}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0 12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:16px;margin:0 0 10px}
input,select,button{font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;margin-bottom:8px;background:#fff}
button{background:#2563eb;color:#fff;border:none;font-weight:600}
button.sub{background:#e5e7eb;color:#111}
button.del{background:#fee2e2;color:#b91c1c;width:auto;padding:4px 10px;margin:0;font-size:14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:15px}
.item small{color:#666;display:block}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chk label{background:#f3f4f6;padding:6px 10px;border-radius:16px;font-size:14px}
.chk input{width:auto;margin:0 4px 0 0;padding:0}
.plus{color:#15803d;font-weight:700}
.minus{color:#b91c1c;font-weight:700}
.big{font-size:18px;font-weight:700}
.muted{color:#666;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>🧾 여행 회비 정산</h1>

<div class="card">
<h2>1. 멤버 / 총무</h2>
<div id="names"></div>
<label class="muted">회비를 받아서 들고 있는 사람(총무)</label>
<select id="treasurer"></select>
</div>

<div class="card">
<h2>2. 회비 낸 돈</h2>
<div class="row">
<select id="cWho"></select>
<input id="cAmt" type="number" inputmode="numeric" placeholder="금액">
</div>
<button onclick="addContrib()">회비 입금 추가</button>
<div id="cList"></div>
</div>

<div class="card">
<h2>3. 쓴 돈 (지출)</h2>
<input id="eDesc" placeholder="내용 (예: 점심, 택시)">
<div class="row">
<input id="eAmt" type="number" inputmode="numeric" placeholder="금액">
<select id="ePayer"></select>
</div>
<div class="muted">누가 냈나: '회비'는 총무가 회비에서 쓴 것, 이름은 그 사람이 개인 돈으로 먼저 낸 것</div>
<div class="muted" style="margin-top:6px">누구 몫인가 (체크한 사람끼리 나눔)</div>
<div class="chk" id="eWho"></div>
<button onclick="addExp()">지출 추가</button>
<div id="eList"></div>
</div>

<div class="card">
<h2>4. 정산 결과</h2>
<div id="result"></div>
<div class="row" style="margin-top:8px;align-items:center">
<input id="rate" type="number" inputmode="decimal" placeholder="1 VND = ? 원 (선택, 예: 0.054)">
</div>
</div>

<div class="card">
<h2>5. 저장</h2>
<button onclick="makeImage()">📷 정산 내역 이미지로 저장</button>
<div id="imgBox"></div>
<div class="row">
<button class="sub" onclick="exportJson()">백업 파일 저장</button>
<button class="sub" onclick="document.getElementById('imp').click()">백업 불러오기</button>
</div>
<input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importJson(this)">
</div>

<button class="sub" onclick="resetAll()">전체 초기화</button>
</div>

<script>
const KEY='trip_settle_v1';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{
  names:['친구1','친구2','친구3','친구4','친구5'],
  treasurer:0, contribs:[], exps:[], rate:''
};
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addContrib(){
  const who=+document.getElementById('cWho').value;
  const amt=+document.getElementById('cAmt').value;
  if(!amt||amt<=0){alert('금액을 입력하세요');return}
  S.contribs.push({who,amt});
  document.getElementById('cAmt').value='';
  save();
}
function addExp(){
  const desc=document.getElementById('eDesc').value.trim()||'지출';
  const amt=+document.getElementById('eAmt').value;
  const payer=document.getElementById('ePayer').value; // 'fund' or index
  const who=[...document.querySelectorAll('#eWho input:checked')].map(x=>+x.value);
  if(!amt||amt<=0){alert('금액을 입력하세요');return}
  if(!who.length){alert('누구 몫인지 1명 이상 체크하세요');return}
  S.exps.push({desc,amt,payer,who});
  document.getElementById('eDesc').value='';
  document.getElementById('eAmt').value='';
  save();
}
function delC(i){S.contribs.splice(i,1);save()}
function delE(i){S.exps.splice(i,1);save()}
function resetAll(){
  if(confirm('모든 기록을 지울까요?')){localStorage.removeItem(KEY);location.reload()}
}

function render(){
  const n=S.names.length;
  // names
  document.getElementById('names').innerHTML=S.names.map((nm,i)=>
    `<input value="${esc(nm)}" onchange="S.names[${i}]=this.value||'친구${i+1}';save()">`).join('');
  const opts=S.names.map((nm,i)=>`<option value="${i}">${esc(nm)}</option>`).join('');
  const tr=document.getElementById('treasurer');
  tr.innerHTML=opts; tr.value=S.treasurer;
  tr.onchange=()=>{S.treasurer=+tr.value;save()};
  const cw=document.getElementById('cWho'); const cv=cw.value; cw.innerHTML=opts; if(cv)cw.value=cv;
  const ep=document.getElementById('ePayer'); const pv=ep.value;
  ep.innerHTML=`<option value="fund">회비에서</option>`+opts; if(pv)ep.value=pv;
  // checkboxes keep state
  const prev=[...document.querySelectorAll('#eWho input')].map(x=>x.checked);
  document.getElementById('eWho').innerHTML=S.names.map((nm,i)=>
    `<label><input type="checkbox" value="${i}" ${prev.length?(prev[i]?'checked':''):'checked'}>${esc(nm)}</label>`).join('');
  // lists
  document.getElementById('cList').innerHTML=S.contribs.map((c,i)=>
    `<div class="item"><span>${esc(S.names[c.who])}</span><span>${fmt(c.amt)} <button class="del" onclick="delC(${i})">삭제</button></span></div>`).join('');
  document.getElementById('eList').innerHTML=S.exps.map((e,i)=>
    `<div class="item"><span>${esc(e.desc)}<small>${e.payer==='fund'?'회비에서':esc(S.names[e.payer])+' 개인결제'} · ${e.who.length}명 분담</small></span><span>${fmt(e.amt)} <button class="del" onclick="delE(${i})">삭제</button></span></div>`).join('');
  // calc
  const paid=Array(n).fill(0), share=Array(n).fill(0);
  let C=0,F=0,total=0;
  S.contribs.forEach(c=>{paid[c.who]+=c.amt;C+=c.amt});
  S.exps.forEach(e=>{
    total+=e.amt;
    if(e.payer==='fund')F+=e.amt; else paid[+e.payer]+=e.amt;
    e.who.forEach(w=>share[w]+=e.amt/e.who.length);
  });
  const net=paid.map((p,i)=>p-share[i]);
  const t=S.treasurer;
  const rate=+S.rate||0;
  const won=v=>rate?` <span class="muted">(약 ${fmt(v*rate)}원)</span>`:'';
  let h=`<div class="item"><span>총 지출</span><span>${fmt(total)}${won(total)}</span></div>
  <div class="item"><span>걷은 회비</span><span>${fmt(C)}</span></div>
  <div class="item"><span>회비로 쓴 돈</span><span>${fmt(F)}</span></div>
  <div class="item"><span>총무(${esc(S.names[t])}) 손에 남은 회비</span><span class="big">${fmt(C-F)}${won(C-F)}</span></div>
  <div class="item"><span>1인 평균 부담</span><span>${fmt(total/n)}</span></div><hr>`;
  S.names.forEach((nm,i)=>{
    if(i===t)return;
    const v=Math.round(net[i]);
    let msg;
    if(v>0)msg=`<span class="plus">${esc(S.names[t])} → ${esc(nm)}에게 ${fmt(v)} 받음</span>`;
    else if(v<0)msg=`<span class="minus">${esc(nm)} → ${esc(S.names[t])}에게 ${fmt(-v)} 더 냄</span>`;
    else msg='정산 없음';
    h+=`<div class="item"><span>${esc(nm)}<small>낸 돈 ${fmt(paid[i])} · 부담 ${fmt(share[i])}</small></span><span>${msg}${v?won(Math.abs(v)):''}</span></div>`;
  });
  h+=`<div class="item"><span>${esc(S.names[t])} (총무)<small>낸 돈 ${fmt(paid[t])} · 부담 ${fmt(share[t])}</small></span><span>최종 본인 몫 ${fmt(net[t])}</span></div>`;
  document.getElementById('result').innerHTML=h;
  document.getElementById('rate').value=S.rate;
}
document.getElementById('rate').addEventListener('change',e=>{S.rate=e.target.value;save()});

function calcAll(){
  const n=S.names.length;
  const paid=Array(n).fill(0), share=Array(n).fill(0);
  let C=0,F=0,total=0;
  S.contribs.forEach(c=>{paid[c.who]+=c.amt;C+=c.amt});
  S.exps.forEach(e=>{
    total+=e.amt;
    if(e.payer==='fund')F+=e.amt; else paid[+e.payer]+=e.amt;
    e.who.forEach(w=>share[w]+=e.amt/e.who.length);
  });
  return {n,paid,share,C,F,total,net:paid.map((p,i)=>p-share[i]),t:S.treasurer};
}

function makeImage(){
  const d=calcAll(), t=d.t, rate=+S.rate||0;
  const wonTxt=v=>rate?` (약 ${fmt(v*rate)}원)`:'';
  const items=[];
  const now=new Date();
  items.push({k:'title',l:'여행 회비 정산'});
  items.push({k:'date',l:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} · 총무 ${S.names[t]}`});
  items.push({k:'sec',l:'회비 낸 돈'});
  S.contribs.forEach(c=>items.push({k:'row',l:S.names[c.who],r:fmt(c.amt)}));
  items.push({k:'row',l:'합계',r:fmt(d.C),b:1});
  items.push({k:'sec',l:'지출 내역'});
  S.exps.forEach(e=>items.push({k:'row',l:e.desc,s:(e.payer==='fund'?'회비에서':S.names[e.payer]+' 개인결제')+' · '+e.who.length+'명 분담',r:fmt(e.amt)}));
  items.push({k:'row',l:'총 지출',r:fmt(d.total)+wonTxt(d.total),b:1});
  items.push({k:'sec',l:'정산 결과'});
  items.push({k:'row',l:'걷은 회비',r:fmt(d.C)});
  items.push({k:'row',l:'회비로 쓴 돈',r:fmt(d.F)});
  items.push({k:'row',l:'총무 손에 남은 회비',r:fmt(d.C-d.F)+wonTxt(d.C-d.F),b:1});
  items.push({k:'row',l:'1인 평균 부담',r:fmt(d.total/d.n)});
  S.names.forEach((nm,i)=>{
    if(i===t)return;
    const v=Math.round(d.net[i]);
    let msg,col='#111';
    if(v>0){msg=`${S.names[t]} → ${nm}에게 ${fmt(v)} 받음`;col='#15803d'}
    else if(v<0){msg=`${nm} → ${S.names[t]}에게 ${fmt(-v)} 더 냄`;col='#b91c1c'}
    else msg='정산 없음';
    items.push({k:'row',l:nm,s:`낸 돈 ${fmt(d.paid[i])} · 부담 ${fmt(d.share[i])}`,r:msg+(v?wonTxt(Math.abs(v)):''),c:col,b:1});
  });
  const H={title:80,date:50,sec:70,row:48,rows:64};
  const W=900,pad=40;
  let height=pad;
  items.forEach(it=>height+=(it.k==='row'&&it.s)?H.rows:H[it.k]);
  height+=pad;
  const cv=document.createElement('canvas');
  const sc=2;
  cv.width=W*sc;cv.height=height*sc;
  const x=cv.getContext('2d');
  x.scale(sc,sc);
  x.fillStyle='#fff';x.fillRect(0,0,W,height);
  const F='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  let y=pad;
  items.forEach(it=>{
    if(it.k==='title'){
      x.fillStyle='#111';x.font=`bold 38px ${F}`;x.textAlign='left';x.fillText(it.l,pad,y+48);y+=H.title;
    }else if(it.k==='date'){
      x.fillStyle='#666';x.font=`22px ${F}`;x.textAlign='left';x.fillText(it.l,pad,y+24);y+=H.date;
    }else if(it.k==='sec'){
      x.fillStyle='#2563eb';x.fillRect(pad,y+22,W-pad*2,38);
      x.fillStyle='#fff';x.font=`bold 24px ${F}`;x.textAlign='left';x.fillText(it.l,pad+14,y+49);y+=H.sec;
    }else{
      const hh=it.s?H.rows:H.row;
      x.fillStyle=it.c||'#111';x.textAlign='left';
      x.font=`${it.b?'bold ':''}26px ${F}`;
      x.fillText(it.l,pad+6,y+(it.s?28:32));
      if(it.s){x.fillStyle='#666';x.font=`20px ${F}`;x.fillText(it.s,pad+6,y+54)}
      x.fillStyle=it.c||'#111';x.textAlign='right';
      x.font=`${it.b?'bold ':''}${it.r.length>16?22:26}px ${F}`;
      x.fillText(it.r,W-pad-6,y+(it.s?28:32));
      x.strokeStyle='#e5e7eb';x.beginPath();x.moveTo(pad,y+hh-4);x.lineTo(W-pad,y+hh-4);x.stroke();
      y+=hh;
    }
  });
  cv.toBlob(async blob=>{
    const url=URL.createObjectURL(blob);
    const name='정산내역_'+new Date().toISOString().slice(0,10)+'.png';
    document.getElementById('imgBox').innerHTML=
      `<img src="${url}" style="width:100%;border:1px solid #ddd;border-radius:8px;margin-bottom:8px">
       <div class="muted" style="margin-bottom:8px">저장이 안 되면 이미지를 길게 눌러 '이미지 저장'을 선택하세요.</div>
       <a href="${url}" download="${name}"><button style="margin-bottom:8px">이미지 다운로드</button></a>
       <button id="shareBtn" class="sub">공유하기 (카톡 등)</button>`;
    document.getElementById('shareBtn').onclick=async()=>{
      try{
        const f=new File([blob],name,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'정산 내역'});
        else alert('이 브라우저는 공유를 지원하지 않아요. 이미지를 길게 눌러 저장하세요.');
      }catch(e){}
    };
  },'image/png');
}

function exportJson(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='정산백업_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJson(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o.names||!o.contribs||!o.exps)throw 0;
      S=o;save();alert('불러왔어요');
    }catch(e){alert('올바른 백업 파일이 아니에요')}
  };
  r.readAsText(f);
  inp.value='';
}
render();
</script>
</body>
</html>
